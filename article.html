<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blog.slabb.dev</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0b0d'/%3E%3Crect x='20' y='20' width='24' height='24' rx='4' fill='%237de8a9'/%3E%3C/svg%3E">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="index.html">slabb<span>.dev</span><span style="color:var(--accent)">/blog</span></a>
    <div class="barright">
      <span class="pill" id="langSwitch" style="cursor:pointer;display:none"></span>
      <a class="pill" href="https://slabb.dev">← le site</a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:44px">
  <a class="back" href="index.html" id="back">← tous les articles</a>
  <p class="meta" id="meta"></p>
  <h1 id="titre"></h1>
  <p class="sub" id="resume" style="font-style:italic"></p>
  <div class="md" id="content"></div>
</main>

<footer>
  <div class="wrap foot">
    <span>⬛ black boxes for systems nobody can fully trust</span>
    <span>blog.slabb.dev — statique, zéro tracking · © 2026 Sam Labbe</span>
  </div>
</footer>

<script src="js/marked.min.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var slug=q.get('p')||'';
  var langs=q.get('l')==='en'?'en':'fr';
  var other=(langs==='en')?'fr':'en';
  var sw=document.getElementById('langSwitch');
  var cache={},versions=['fr'];
  function parseFM(txt){
    if(txt.indexOf('---')!==0)return{fm:{},body:txt};
    var end=txt.indexOf('---',3),fm={},body=txt.slice(end+3).replace(/^\s+/,'');
    txt.slice(3,end).split('\n').forEach(function(l){var i=l.indexOf(':');if(i>0)fm[l.slice(0,i).trim()]=l.slice(i+1).trim().replace(/^["']|["']$/g,'')});
    return{fm:fm,body:body};
  }
  var LBL={agents:['Agents IA','AI agents'],securite:['Sécurité','Security'],preuve:['Preuve & conformité','Proof & compliance'],web:['Web & produit','Web & product'],devops:['DevOps & CI/CD','DevOps & CI/CD'],crypto:['Crypto','Crypto']};
  function tl(k){var v=LBL[k]||[k,k];return document.documentElement.lang==='en'?v[1]:v[0]}
  function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(lang){
    var c=cache[lang];if(!c)return;
    document.documentElement.lang=lang;
    var t=(lang==='en'&&c.fm.titre_en)?c.fm.titre_en:c.fm.titre;
    var res=(lang==='en'&&c.fm.resume_en)?c.fm.resume_en:c.fm.resume;
    document.title=t+' — blog.slabb.dev';
    document.getElementById('titre').textContent=t;
    document.getElementById('resume').textContent=res||'';
    var words=c.body.split(/\s+/).length, mins=Math.max(1,Math.round(words/200));
    var en=new Intl.DateTimeFormat(lang==='en'?'en-GB':'fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(new Date(c.fm.date||Date.now()));
    document.getElementById('meta').innerHTML='<span>'+en+'</span><span>'+mins+' min</span>'+
      (c.fm.themes?c.fm.themes.split(',').map(function(k){return '<span class="badge">'+tl(k.trim())+'</span>'}).join(''):'')+
      (c.fm.source?'<a href="'+esc(c.fm.source)+'" style="color:var(--dim)">'+L('source ↗','source ↗')+'</a>':'');
    document.getElementById('content').innerHTML=marked.parse(c.body);
    document.getElementById('back').textContent=L('← tous les articles','← all posts');
  }
  function L(fr,en){return langs==='en'?en:fr}
  function setSwitch(){
    if(!cache.en){sw.style.display='none';return}
    sw.style.display='inline-block';
    sw.textContent=other.toUpperCase();
    sw.onclick=function(){location.href='article.html?p='+encodeURIComponent(slug)+'&l='+other};
  }
  fetch('posts/'+slug+'.fr.md').then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(fr){
    var f=parseFM(fr);cache.fr=f;
    fetch('posts/'+slug+'.en.md').then(function(r){if(!r.ok)throw 0;return r.text()},function(){return null}).then(function(enm){
      if(enm){cache.en=parseFM(enm);versions.push('en')}
      render(langs);setSwitch();
    });
  }).catch(function(){
    document.getElementById('titre').textContent=L('Article introuvable','Post not found');
    document.getElementById('content').innerHTML='<p style="color:var(--dim)"><code>posts/'+esc(slug)+'.md</code></p>';
  });
})();
</script>
</body>
</html>
